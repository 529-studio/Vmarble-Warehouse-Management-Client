name: "Build & Deploy"

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging-fe-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: "🔨 Build & Deploy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          IMAGE_NAME="${{ env.REGISTRY }}/${REPO_LOWER}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "sha_tag=${IMAGE_NAME}:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "stg_tag=${IMAGE_NAME}:stg-latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.stg_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Redeploy Webhook
        run: |
          curl -sS -f -X POST "${{ secrets.DOKPLOY_FE_WEBHOOK_URL }}"

      - name: Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          PROJECT="FE-Staging"
          
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{ \"content\": \"**[$PROJECT]** $STATUS: $COMMIT_MSG (by ${{ github.actor }}) | [Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\" }"
