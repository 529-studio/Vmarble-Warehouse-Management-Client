name: Build & Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-fe-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/529-studio/vmarble-warehouse-management-client

jobs:
  build-and-deploy:
    name: "🔨 Build & Deploy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: vars
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=${IMAGE_NAME}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=${IMAGE_NAME}:stg-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.env_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Redeploy Webhook
        run: |
          curl -sS -f -X POST "${{ secrets.DOKPLOY_FE_WEBHOOK_URL }}"
