services:
  frontend:
    image: ${APP_IMAGE:-ghcr.io/529-studio/vmarble-warehouse-management-client:stg-latest}
    pull_policy: always
    container_name: vwms-fe
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "10.8.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
