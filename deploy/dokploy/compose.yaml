services:
  vwms-frontend:
    image: ghcr.io/529-studio/vmarble-warehouse-management-client:stg-latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://vwms-backend:8080}
      PORT: "3000"
      NODE_ENV: "${NODE_ENV:-production}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  dokploy-network:
    external: true
